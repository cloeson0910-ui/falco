<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Falco S.R.L. — Onoranze Funebri</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400&family=EB+Garamond:ital,wght@0,400;0,500;1,400&display=swap');

  :root{
    --black: #060504;
    --charcoal: #0d0b09;
    --gold-light: #f2dfb0;
    --gold: #cda15a;
    --gold-deep: #8a6a34;
    --flame: #ffb15e;
    --flame-core: #fff2d6;
    --ember: #a8431f;
    --smoke: rgba(232, 214, 170, 0.55);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    background: var(--black);
    color: var(--gold-light);
    font-family: 'EB Garamond', serif;
    overflow-x: hidden;
  }

  body{
    min-height:100vh;
    display:flex;
    flex-direction:column;
  }

  .vignette{
    position: fixed;
    inset: 0;
    pointer-events:none;
    background: radial-gradient(ellipse at 50% 42%, rgba(0,0,0,0) 0%, rgba(0,0,0,0) 30%, rgba(0,0,0,0.55) 78%, rgba(0,0,0,0.92) 100%);
    z-index: 5;
  }

  header{
    text-align:center;
    padding: 3.2rem 1.5rem 0.5rem;
    letter-spacing: 0.14em;
    font-size: 0.78rem;
    color: var(--smoke);
    text-transform: uppercase;
    font-family: 'EB Garamond', serif;
  }

  .stage{
    position: relative;
    display:flex;
    align-items:center;
    justify-content:center;
    gap: clamp(1rem, 6vw, 6rem);
    padding: 1rem 1.5rem 0;
    flex: 1;
    min-height: 62vh;
  }

  .candles{
    display:flex;
    align-items:flex-end;
    gap: clamp(0.8rem, 2.5vw, 2.2rem);
    flex-shrink: 0;
  }

  .candle{
    position:relative;
    width: clamp(14px, 2.2vw, 22px);
    display:flex;
    flex-direction:column;
    align-items:center;
  }

  .candle .flame-glow{
    position:absolute;
    top: -46px;
    width: 90px;
    height: 90px;
    border-radius:50%;
    background: radial-gradient(circle, rgba(255,177,94,0.55) 0%, rgba(255,177,94,0.18) 40%, rgba(255,177,94,0) 72%);
    filter: blur(2px);
    animation: glowpulse 2.6s ease-in-out infinite;
    z-index: 1;
  }

  .candle .flame{
    position: relative;
    width: 13px;
    height: 30px;
    margin-bottom: -3px;
    transform-origin: 50% 100%;
    animation: sway 2.3s ease-in-out infinite;
    z-index: 2;
  }

  .candle .flame-outer{
    position:absolute;
    bottom: 0;
    left: 50%;
    width: 13px;
    height: 30px;
    margin-left: -6.5px;
    background: radial-gradient(ellipse at 50% 78%, var(--flame-core) 0%, var(--flame) 42%, var(--ember) 82%, transparent 100%);
    border-radius: 50% 50% 50% 50% / 68% 68% 32% 32%;
    transform-origin: 50% 100%;
    animation: flicker-outer 1.9s ease-in-out infinite;
  }

  .candle .flame-inner{
    position:absolute;
    bottom: 2px;
    left: 50%;
    width: 6px;
    height: 15px;
    margin-left: -3px;
    background: radial-gradient(ellipse at 50% 80%, #fffef2 0%, #ffe9a8 55%, rgba(255,233,168,0) 100%);
    border-radius: 50% 50% 50% 50% / 70% 70% 30% 30%;
    transform-origin: 50% 100%;
    animation: flicker-inner 1.9s ease-in-out infinite;
    mix-blend-mode: screen;
  }

  .candle .wick{
    width: 2px;
    height: 6px;
    background: #2a2018;
    margin-bottom: -1px;
    z-index: 2;
  }

  .candle .body{
    width: 100%;
    height: clamp(70px, 14vw, 150px);
    background: linear-gradient(180deg, #efe6d2 0%, #ddd0ab 35%, #cabb8e 65%, #b6a377 100%);
    border-radius: 3px 3px 2px 2px;
    box-shadow: inset -4px 0 6px rgba(0,0,0,0.25), inset 3px 0 4px rgba(255,255,255,0.3);
    position: relative;
  }

  .candle .drip{
    position:absolute;
    top: 10%;
    left: -1px;
    width: 4px;
    height: 30%;
    background: linear-gradient(180deg, #f3ead4, #cabb8e);
    border-radius: 0 0 3px 3px;
  }

  .candle.tall .body{ height: clamp(90px, 17vw, 190px); }
  .candle.short .body{ height: clamp(50px, 10vw, 108px); }

  .candles.right{ transform: scaleX(-1); }

  .candle:nth-child(1) .flame, .candle:nth-child(1) .flame-glow{ animation-delay: 0s; }
  .candle:nth-child(2) .flame, .candle:nth-child(2) .flame-glow{ animation-delay: -0.6s; }
  .candle:nth-child(3) .flame, .candle:nth-child(3) .flame-glow{ animation-delay: -1.1s; }
  .candle:nth-child(1) .flame-outer, .candle:nth-child(1) .flame-inner{ animation-delay: -0.3s; }
  .candle:nth-child(2) .flame-outer, .candle:nth-child(2) .flame-inner{ animation-delay: -0.9s; }
  .candle:nth-child(3) .flame-outer, .candle:nth-child(3) .flame-inner{ animation-delay: -1.4s; }

  @keyframes sway{
    0%   { transform: rotate(0deg) skewX(0deg); }
    18%  { transform: rotate(-3.5deg) skewX(-2deg); }
    34%  { transform: rotate(2deg) skewX(1.5deg); }
    52%  { transform: rotate(-1.5deg) skewX(-1deg); }
    68%  { transform: rotate(3deg) skewX(2deg); }
    83%  { transform: rotate(-2deg) skewX(-1.5deg); }
    100% { transform: rotate(0deg) skewX(0deg); }
  }

  @keyframes flicker-outer{
    0%   { transform: scaleY(1) scaleX(1); opacity: 1; }
    15%  { transform: scaleY(1.12) scaleX(0.88); opacity: 0.94; }
    30%  { transform: scaleY(0.86) scaleX(1.1); opacity: 1; }
    45%  { transform: scaleY(1.06) scaleX(0.95); opacity: 0.9; }
    60%  { transform: scaleY(0.92) scaleX(1.08); opacity: 1; }
    75%  { transform: scaleY(1.1) scaleX(0.9); opacity: 0.95; }
    90%  { transform: scaleY(0.95) scaleX(1.03); opacity: 1; }
    100% { transform: scaleY(1) scaleX(1); opacity: 1; }
  }

  @keyframes flicker-inner{
    0%   { transform: scaleY(1) scaleX(1); }
    20%  { transform: scaleY(0.85) scaleX(1.15); }
    38%  { transform: scaleY(1.15) scaleX(0.85); }
    55%  { transform: scaleY(0.9) scaleX(1.1); }
    72%  { transform: scaleY(1.1) scaleX(0.92); }
    88%  { transform: scaleY(0.95) scaleX(1.05); }
    100% { transform: scaleY(1) scaleX(1); }
  }

  @keyframes glowpulse{
    0%, 100% { opacity: 0.7; transform: scale(1); }
    30% { opacity: 0.95; transform: scale(1.08); }
    55% { opacity: 0.8; transform: scale(0.96); }
    80% { opacity: 1; transform: scale(1.12); }
  }

  .brand{
    position: relative;
    display:flex;
    flex-direction:column;
    align-items:center;
    flex-shrink: 1;
    min-width: 0;
    z-index: 1;
  }

  .brand-ambient{
    position:absolute;
    top: 50%;
    left:50%;
    width: 150%;
    height: 220%;
    transform: translate(-50%,-50%);
    background: radial-gradient(ellipse at center, rgba(255,177,94,0.18) 0%, rgba(255,177,94,0.06) 45%, rgba(255,177,94,0) 74%);
    animation: glowpulse 4.2s ease-in-out infinite;
    z-index: 0;
    pointer-events:none;
  }

  .brand-name{
    position: relative;
    z-index: 1;
    font-family: 'Cormorant Garamond', serif;
    font-weight: 600;
    font-size: clamp(2.6rem, 9vw, 5.6rem);
    letter-spacing: 0.06em;
    line-height: 1;
    margin: 0;
    background: linear-gradient(180deg, #f2dfae 0%, #cda15a 55%, #93712f 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    filter: drop-shadow(0 0 18px rgba(255,177,94,0.20));
    animation: logoglow 4.2s ease-in-out infinite;
    text-align:center;
    white-space: nowrap;
  }

  .brand-sub{
    position: relative;
    z-index: 1;
    display:flex;
    align-items:center;
    gap: 1rem;
    margin-top: 0.7rem;
  }

  .brand-sub .rule{
    width: 34px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .brand-sub span{
    font-family: 'EB Garamond', serif;
    font-weight: 500;
    font-size: clamp(0.8rem, 1.5vw, 1.05rem);
    letter-spacing: 0.34em;
    color: var(--gold);
    text-transform: uppercase;
    white-space: nowrap;
  }

  @keyframes logoglow{
    0%, 100% { filter: drop-shadow(0 0 14px rgba(255,177,94,0.18)); }
    50% { filter: drop-shadow(0 0 24px rgba(255,177,94,0.34)); }
  }

  .slogan{
    text-align:center;
    padding: 1.6rem 1.5rem 0.4rem;
    max-width: 640px;
    margin: 0 auto;
  }

  .slogan p{
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(1.3rem, 3.2vw, 2rem);
    color: var(--gold-light);
    margin: 0;
    line-height: 1.4;
    letter-spacing: 0.01em;
  }

  .slogan .rule{
    width: 64px;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1.1rem auto 0;
  }

  .info{
    text-align:center;
    padding: 2rem 1.5rem 3rem;
    font-size: 0.95rem;
    color: var(--smoke);
    letter-spacing: 0.02em;
  }

  .info p{ margin: 0.35rem 0; }

  .cta{
    display:inline-block;
    margin-top: 1.4rem;
    padding: 0.75rem 2.1rem;
    border: 1px solid var(--gold-deep);
    color: var(--gold-light);
    text-decoration:none;
    font-family: 'EB Garamond', serif;
    letter-spacing: 0.1em;
    font-size: 0.82rem;
    text-transform: uppercase;
    border-radius: 2px;
    transition: background 0.4s ease, color 0.4s ease, box-shadow 0.4s ease;
  }

  .cta:hover{
    background: rgba(205,161,90,0.12);
    box-shadow: 0 0 18px rgba(255,177,94,0.25);
  }

  footer{
    text-align:center;
    padding: 1.2rem 1.5rem 1.6rem;
    font-size: 0.72rem;
    color: rgba(232,214,170,0.32);
    letter-spacing: 0.08em;
  }

  @media (max-width: 720px){
    .stage{ gap: 0.6rem; flex-wrap: nowrap; min-height: 52vh; }
    .candles{ gap: 0.45rem; }
    .candle{ width: 10px; }
  }

  @media (max-width: 480px){
    .candles:first-of-type .candle:nth-child(3),
    .candles:last-of-type .candle:nth-child(3){ display:none; }
  }

  @media (prefers-reduced-motion: reduce){
    .flame, .flame-glow, .flame-outer, .flame-inner, .brand-ambient, .brand-name{ animation: none; }
  }

  .curtain-panel{
    position: fixed;
    top: 0;
    width: 51%;
    height: 100%;
    z-index: 200;
    background-image:
      radial-gradient(ellipse at 50% -8%, rgba(255,180,140,0.10), transparent 55%),
      linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.25) 60%, rgba(0,0,0,0.6) 100%),
      repeating-linear-gradient(94deg,
        #0f0202 0px,
        #260505 7px,
        #430a09 14px,
        #5c0f0c 20px,
        #430a09 26px,
        #260505 33px,
        #0f0202 42px
      );
    background-blend-mode: screen, multiply, normal;
    box-shadow: inset 0 0 120px rgba(0,0,0,0.75);
    transition: transform 1.15s cubic-bezier(.76,0,.24,1);
    pointer-events: none;
  }

  .curtain-panel::after{
    content: '';
    position: absolute;
    inset: 0;
    background: repeating-linear-gradient(94deg, rgba(0,0,0,0.28) 0px, transparent 2px, transparent 20px, rgba(0,0,0,0.28) 22px);
    mix-blend-mode: multiply;
    pointer-events: none;
  }

  .curtain-panel.left{ left: 0; transform: translateX(-100%); border-right: 3px solid #8a6a34; }
  .curtain-panel.right{ right: 0; transform: translateX(100%); border-left: 3px solid #8a6a34; }

  body.curtain-closing .curtain-panel.left{ transform: translateX(0); }
  body.curtain-closing .curtain-panel.right{ transform: translateX(0); }

  body.curtain-start-closed .curtain-panel.left,
  body.curtain-start-closed .curtain-panel.right{ transform: translateX(0); transition: none; }

  body.curtain-opening .curtain-panel.left{ transform: translateX(-100%); transition: transform 1.1s cubic-bezier(.76,0,.24,1); }
  body.curtain-opening .curtain-panel.right{ transform: translateX(100%); transition: transform 1.1s cubic-bezier(.76,0,.24,1); }
</style>
</head>
<body>

<div class="vignette"></div>

<header>Falco &middot; Onoranze Funebri</header>

<div class="stage">

  <div class="candles left" aria-hidden="true">
    <div class="candle short"><div class="flame-glow"></div><div class="flame"><div class="flame-outer"></div><div class="flame-inner"></div></div><div class="wick"></div><div class="body"><div class="drip"></div></div></div>
    <div class="candle tall"><div class="flame-glow"></div><div class="flame"><div class="flame-outer"></div><div class="flame-inner"></div></div><div class="wick"></div><div class="body"><div class="drip"></div></div></div>
    <div class="candle"><div class="flame-glow"></div><div class="flame"><div class="flame-outer"></div><div class="flame-inner"></div></div><div class="wick"></div><div class="body"><div class="drip"></div></div></div>
  </div>

  <div class="brand">
    <div class="brand-ambient"></div>
    <h1 class="brand-name">Falco</h1>
    <div class="brand-sub">
      <div class="rule"></div>
      <span>Onoranze funebri</span>
      <div class="rule"></div>
    </div>
  </div>

  <div class="candles right" aria-hidden="true">
    <div class="candle short"><div class="flame-glow"></div><div class="flame"><div class="flame-outer"></div><div class="flame-inner"></div></div><div class="wick"></div><div class="body"><div class="drip"></div></div></div>
    <div class="candle tall"><div class="flame-glow"></div><div class="flame"><div class="flame-outer"></div><div class="flame-inner"></div></div><div class="wick"></div><div class="body"><div class="drip"></div></div></div>
    <div class="candle"><div class="flame-glow"></div><div class="flame"><div class="flame-outer"></div><div class="flame-inner"></div></div><div class="wick"></div><div class="body"><div class="drip"></div></div></div>
  </div>

</div>

<div class="slogan">
  <p>Accompagniamo con cura ogni ultimo viaggio.</p>
  <div class="rule"></div>
</div>

<div class="info">
  <p>Disponibili ogni giorno, ad ogni ora, al vostro fianco.</p>
  <a class="cta" href="servizi.html" id="enterBtn">Entra</a>
</div>

<footer>&copy; Falco S.R.L. &mdash; Tutti i diritti riservati</footer>

<div class="curtain-panel left" aria-hidden="true"></div>
<div class="curtain-panel right" aria-hidden="true"></div>

<script>
  document.getElementById('enterBtn').addEventListener('click', function(e){
    e.preventDefault();
    var href = this.getAttribute('href');
    document.body.classList.add('curtain-closing');
    setTimeout(function(){
      window.location.href = href;
    }, 1150);
  });
</script>

</body>
</html>
